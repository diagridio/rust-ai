[package]
name = "diagrid-goose"
description = "Durable Dapr Workflow wrapper for Goose, driven entirely over its stable ACP interface"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["dapr", "workflow", "goose", "ai-agents", "durable-execution"]
categories = ["asynchronous", "development-tools"]
documentation = "https://docs.rs/diagrid-goose"
homepage = "https://www.diagrid.io"

[dependencies]
dapr = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
agent-client-protocol = { workspace = true }
log = "0.4"

# The relay in src/connect.rs, which gives the Dapr SDK's plaintext, token-less
# connection the TLS and API token Catalyst requires.
http = "1"
hyper = { version = "1", features = ["server", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
env_logger = { workspace = true }
axum = "0.8"
# src/connect.rs tests: a token-checking gRPC server, over plaintext and over TLS.
rcgen = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
tonic-health = "0.14"
