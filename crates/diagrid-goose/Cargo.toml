[package]
name = "diagrid-goose"
description = "Durable Dapr Workflow wrapper for Goose, driven entirely over its stable ACP interface"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["dapr", "workflow", "goose", "ai-agents", "durable-execution"]
categories = ["asynchronous", "development-tools"]
documentation = "https://docs.rs/diagrid-goose"
homepage = "https://www.diagrid.io"

[dependencies]
dapr = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
agent-client-protocol = { workspace = true }
log = "0.4"

[dev-dependencies]
env_logger = { workspace = true }
axum = "0.8"
