name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Build (library, examples and tests)
        run: cargo build --workspace --all-targets

      # Tests marked #[ignore] need a goose binary and are skipped here. Nothing
      # else in the suite needs a live Dapr sidecar.
      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Package contents
        run: |
          cargo package --list -p diagrid-goose | tee package-files.txt
          grep -qx LICENSE.md package-files.txt
          grep -qx README.md package-files.txt

      # Builds the package exactly as crates.io would, license and README included.
      - name: Publish dry run
        run: cargo publish --dry-run -p diagrid-goose
