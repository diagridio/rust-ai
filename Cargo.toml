[workspace]
resolver = "2"
members = ["crates/diagrid-goose"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.md"
repository = "https://github.com/diagridio/rust-ai"

# Pinned to the exact published crates.io release validated locally: activity
# execution, retry policies, and crash recovery (process SIGTERM'd mid-activity
# resumes correctly on restart) all confirmed against v0.19.0 specifically.
[workspace.dependencies]
dapr = { version = "0.19.0", features = ["workflow"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
anyhow = "1"

# The same ACP crate + protocol version Goose itself depends on (goose's
# Cargo.toml pins agent-client-protocol = "2.0.0"; 2.2.0 is the same v1 wire
# protocol, additive-only since). Talking to `goose acp` over this is the
# entire integration surface — no goose source is vendored or modified.
agent-client-protocol = "2.2.0"
